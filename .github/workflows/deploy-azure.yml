name: Deploy Azure Static Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write frontend config
        run: |
          cat > config.js <<'EOF'
          window.EYS_CONFIG = {
            CONVEX_HTTP_URL: "${{ secrets.CONVEX_HTTP_URL }}",
          };
          EOF

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: /
          skip_app_build: true
