<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#053c2a" />
    <title>Admin | Edo Youths Scotland CIC Agency</title>
    <link rel="icon" href="assets/eys-logo-gold-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header on-light-surface" data-header>
      <a class="brand" href="index.html#home" aria-label="Edo Youths Scotland home">
        <img class="brand-logo-rest" src="assets/eys-logo-white-transparent.png" alt="" aria-hidden="true" />
        <img class="brand-logo-scrolled" src="assets/eys-logo-dark-transparent.png" alt="" aria-hidden="true" />
        <span>Edo Youths<br />Scotland</span>
      </a>

      <button class="nav-toggle" data-nav-toggle type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-navigation">
        <span></span>
        <span></span>
      </button>

      <nav class="nav-shell" data-nav id="site-navigation" aria-label="Primary navigation">
        <a href="index.html#story">Story</a>
        <a href="index.html#promise">Promise</a>
        <a href="community.html">Community</a>
        <a href="members.html">Members</a>
        <a href="events.html">Events</a>
        <a href="gallery.html">Gallery</a>
        <a href="blog.html">Blog</a>
      </nav>

      <div class="header-actions">
        <a class="button secondary" href="join.html">Join EYS</a>
        <a class="button primary" href="partner.html">Partner with EYS</a>
      </div>
    </header>

    <main id="main">
      <section class="admin-shell" data-admin-app>
        <section class="admin-login" data-admin-login>
          <form class="admin-form" data-admin-login-form>
            <h2>Sign in</h2>
            <label>
              Email
              <input name="email" type="email" autocomplete="email" placeholder="Email" required />
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="current-password" placeholder="Password" required />
            </label>
            <button class="button primary" type="submit">Sign in</button>
            <p class="form-status" data-admin-login-status role="status"></p>
          </form>
        </section>

        <section class="admin-dashboard" data-admin-dashboard hidden>
          <div class="admin-toolbar">
            <div>
              <strong data-admin-name>Admin</strong>
            </div>
            <button class="button secondary" type="button" data-admin-logout>Sign out</button>
          </div>

          <div class="admin-tabs" role="tablist" aria-label="Admin sections">
            <button class="is-active" type="button" data-admin-tab="requests">Join requests</button>
            <button type="button" data-admin-tab="members">Members</button>
            <button type="button" data-admin-tab="blog">Blog posts</button>
            <button type="button" data-admin-tab="impact">Impact reports</button>
            <button type="button" data-admin-tab="governance">Governance</button>
          </div>

          <section class="admin-panel is-active" data-admin-panel="requests">
            <div class="admin-panel-heading">
              <h2>Join requests</h2>
              <button class="button secondary" type="button" data-refresh-requests>Refresh</button>
            </div>
            <div class="admin-list" data-requests-list></div>
          </section>

          <section class="admin-panel" data-admin-panel="members">
            <div class="admin-panel-heading">
              <h2>Members</h2>
              <button class="button secondary" type="button" data-refresh-members>Refresh</button>
            </div>

            <form class="admin-card admin-form member-editor" data-member-editor>
              <input name="id" type="hidden" />
              <label>
                Name
                <input name="name" type="text" required />
              </label>
              <label>
                Role or contribution
                <input name="role" type="text" placeholder="Member, mentor, volunteer, business owner" required />
              </label>
              <label>
                Location
                <input name="location" type="text" placeholder="Glasgow, Edinburgh, Aberdeen..." required />
              </label>
              <label>
                Bio
                <textarea name="bio" rows="5" required></textarea>
              </label>
              <label>
                Skills or interests
                <input name="skills" type="text" placeholder="Mentoring, catering, photography" />
              </label>
              <label>
                Business or project name
                <input name="businessName" type="text" />
              </label>
              <label>
                Website URL
                <input name="websiteUrl" type="url" placeholder="https://..." />
              </label>
              <label>
                Profile image URL
                <input name="imageUrl" type="url" placeholder="https://..." />
              </label>
              <label>
                Visibility
                <select name="visibility" required>
                  <option value="draft">Draft</option>
                  <option value="public">Public</option>
                  <option value="hidden">Hidden</option>
                </select>
              </label>
              <div class="form-submit">
                <button class="button primary" type="submit">Save member</button>
                <button class="button secondary" type="button" data-clear-member-editor>Clear</button>
              </div>
              <p class="form-status" data-member-editor-status role="status"></p>
            </form>

            <div class="admin-list" data-members-list></div>
          </section>

          <section class="admin-panel" data-admin-panel="blog">
            <div class="admin-panel-heading">
              <h2>Blog posts</h2>
              <button class="button secondary" type="button" data-refresh-posts>Refresh</button>
            </div>

            <form class="admin-card admin-form blog-editor" data-blog-editor>
              <input name="id" type="hidden" />
              <label>
                Title
                <input name="title" type="text" required />
              </label>
              <label>
                Excerpt
                <textarea name="excerpt" rows="3" required></textarea>
              </label>
              <label>
                Body
                <textarea name="body" rows="9" required></textarea>
              </label>
              <label>
                Cover image URL
                <input name="coverImageUrl" type="url" placeholder="https://..." />
              </label>
              <label>
                Status
                <select name="status" required>
                  <option value="draft">Draft</option>
                  <option value="published">Published</option>
                </select>
              </label>
              <div class="form-submit">
                <button class="button primary" type="submit">Save post</button>
                <button class="button secondary" type="button" data-clear-editor>Clear</button>
              </div>
              <p class="form-status" data-blog-editor-status role="status"></p>
            </form>

            <div class="admin-list" data-posts-list></div>
          </section>

          <section class="admin-panel" data-admin-panel="impact">
            <div class="admin-panel-heading">
              <h2>Impact reports</h2>
              <button class="button secondary" type="button" data-refresh-impact-reports>Refresh</button>
            </div>

            <form class="admin-card admin-form impact-editor" data-impact-editor>
              <input name="id" type="hidden" />
              <label>
                Title
                <input name="title" type="text" placeholder="Annual impact note" required />
              </label>
              <label>
                Period
                <input name="period" type="text" placeholder="2026, Q1 2026, Jan-Mar 2026" required />
              </label>
              <label>
                Summary
                <textarea name="summary" rows="3" required></textarea>
              </label>
              <label>
                Body
                <textarea name="body" rows="8" required></textarea>
              </label>
              <label>
                Metric highlights
                <textarea name="metricHighlights" rows="4" placeholder="One highlight per line"></textarea>
              </label>
              <label>
                Report file URL
                <input name="fileUrl" type="url" placeholder="https://..." />
              </label>
              <label>
                Status
                <select name="status" required>
                  <option value="draft">Draft</option>
                  <option value="published">Published</option>
                </select>
              </label>
              <div class="form-submit">
                <button class="button primary" type="submit">Save report</button>
                <button class="button secondary" type="button" data-clear-impact-editor>Clear</button>
              </div>
              <p class="form-status" data-impact-editor-status role="status"></p>
            </form>

            <div class="admin-list" data-impact-reports-list></div>
          </section>

          <section class="admin-panel" data-admin-panel="governance">
            <div class="admin-panel-heading">
              <h2>Governance profiles</h2>
              <button class="button secondary" type="button" data-refresh-governance>Refresh</button>
            </div>

            <form class="admin-card admin-form governance-editor" data-governance-editor>
              <input name="id" type="hidden" />
              <label>
                Name
                <input name="name" type="text" placeholder="Board member, adviser or team group" required />
              </label>
              <label>
                Role
                <input name="role" type="text" placeholder="Director, Safeguarding lead, Community team" required />
              </label>
              <label>
                Bio
                <textarea name="bio" rows="6" required></textarea>
              </label>
              <label>
                Image URL
                <input name="imageUrl" type="url" placeholder="https://..." />
              </label>
              <label>
                Sort order
                <input name="sortOrder" type="number" step="1" value="100" required />
              </label>
              <label>
                Visibility
                <select name="visibility" required>
                  <option value="draft">Draft</option>
                  <option value="public">Public</option>
                  <option value="hidden">Hidden</option>
                </select>
              </label>
              <div class="form-submit">
                <button class="button primary" type="submit">Save profile</button>
                <button class="button secondary" type="button" data-clear-governance-editor>Clear</button>
              </div>
              <p class="form-status" data-governance-editor-status role="status"></p>
            </form>

            <div class="admin-list" data-governance-list></div>
          </section>
        </section>
      </section>
    </main>

    <script src="config.js?v=20260530-governance"></script>
    <script src="script.js?v=20260530-governance"></script>
  </body>
</html>
